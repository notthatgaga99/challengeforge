name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: challengeforge
          POSTGRES_PASSWORD: challengeforge
          POSTGRES_DB: challengeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U challengeforge -d challengeforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://challengeforge:challengeforge@localhost:5432/challengeforge_test
      ADMIN_DATABASE_URL: postgresql+asyncpg://challengeforge:challengeforge@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
