services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: challengeforge
      POSTGRES_PASSWORD: challengeforge
      POSTGRES_DB: challengeforge
    volumes:
      - challengeforge_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challengeforge -d challengeforge"]
      interval: 5s
      timeout: 5s
      retries: 8

volumes:
  challengeforge_pgdata:
